name: Patch gira and community UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          start=s.index('function Giras(')
          end=s.index('function Community(', start)
          new=r'''function Giras({p}){
 const[giras,setGiras]=useState([]),[sel,setSel]=useState(null),[resp,setResp]=useState(null),[av,setAv]=useState([]),[tasks,setTasks]=useState([]),[busy,setBusy]=useState(false),[msg,setMsg]=useState('')
 const load=async()=>{const {data}=await supabase.from('giras').select('*').order('starts_at',{ascending:true});setGiras(data||[])}
 useEffect(()=>{load()},[])
 const open=async g=>{setSel(g);setMsg('');const {data}=await supabase.from('gira_responses').select('*,gira_availability(period_key)').eq('gira_id',g.id).eq('profile_id',p.id).maybeSingle();setResp(data);setAv(data?.gira_availability?.map(x=>x.period_key)||[]);const {data:t}=await supabase.from('tasks').select('*,task_categories(name),task_assignments(id,profile_id,assignment_mode)').eq('gira_id',g.id).order('sort_order');setTasks(t||[])}
 const answer=async status=>{setBusy(true);const {data,error}=await supabase.from('gira_responses').upsert({gira_id:sel.id,profile_id:p.id,status},{onConflict:'gira_id,profile_id'}).select().single();if(error)setMsg(error.message);else{setResp(data);if(status==='not_going'){await supabase.from('gira_availability').delete().eq('gira_response_id',data.id);setAv([])}}setBusy(false)}
 const toggle=async k=>{if(!resp||resp.status!=='going'||busy)return;setBusy(true);if(av.includes(k)){await supabase.from('gira_availability').delete().eq('gira_response_id',resp.id).eq('period_key',k);setAv(av.filter(x=>x!==k))}else{const {error}=await supabase.from('gira_availability').insert({gira_response_id:resp.id,period_key:k});if(!error)setAv([...av,k]);else setMsg(error.message)}setBusy(false)}
 const choose=async taskId=>{setBusy(true);setMsg('');const {error}=await supabase.rpc('leader_choose_gira_task',{p_task_id:taskId});if(error)setMsg(error.message);else{setMsg('Tarefa escolhida.');await open(sel)}setBusy(false)}
 const myTasks=tasks.filter(t=>(t.task_assignments||[]).some(a=>a.profile_id===p.id))
 const capacity={};tasks.forEach(t=>capacity[t.period_key]=(capacity[t.period_key]||0)+Number(t.slots||0));
 const used={};tasks.forEach(t=>used[t.period_key]=(used[t.period_key]||0)+(t.task_assignments||[]).filter(a=>a.assignment_mode!=='leader_choice').length)
 return <>{sel?<><button className="btn" onClick={()=>setSel(null)}>← Todas as giras</button><div className="card"><div className="gira"><div className="art">🌾</div><div><span className="pill">GIRA</span><h2>{sel.name}</h2><p>{dateTime(sel.starts_at)}</p>{sel.what_to_bring&&<p className="small">Levar: {sel.what_to_bring}</p>}{sel.notes&&<p className="muted">{sel.notes}</p>}{Number(sel.contribution_amount)>0&&<p>Contribuição: <b>{money(sel.contribution_amount)}</b></p>}</div></div>{msg&&<div className="toast">{msg}</div>}<div className="choice"><button className={'btn '+(resp?.status==='going'?'active':'')} disabled={busy} onClick={()=>answer('going')}><Check size={15}/> Vou participar</button><button className={'btn '+(resp?.status==='not_going'?'active':'')} disabled={busy} onClick={()=>answer('not_going')}><X size={15}/> Não vou</button></div>{resp?.status==='going'&&<><h3>Quero ajudar</h3><div className="list">{periods.map(([k,l])=>{const full=capacity[k]>0&&used[k]>=capacity[k];const selected=av.includes(k);return <button className={'btn '+(selected?'primary':'')} disabled={busy||(!selected&&full)} key={k} onClick={()=>toggle(k)}>{l} · {selected?'Selecionado':full?'Completo':'Disponível'}</button>})}</div></>}{myTasks.length>0&&<div className="card" style={{marginTop:14}}><span className="eyebrow">MINHAS TAREFAS</span>{myTasks.map(t=><div className="row between" key={t.id}><div><b>{t.name}</b><div className="muted small">{periods.find(x=>x[0]===t.period_key)?.[1]} · {t.task_categories?.name}</div></div><span className="pill">{t.task_assignments?.find(a=>a.profile_id===p.id)?.assignment_mode==='leader_choice'?'ESCOLHIDA':'ATRIBUÍDA'}</span></div>)}</div>}{p.leadership_seal&&resp?.status==='going'&&<div className="card" style={{marginTop:14}}><span className="eyebrow">ESCOLHA DA LIDERANÇA</span><p className="muted">Como liderança, você escolhe sua tarefa. Sua escolha não ocupa uma vaga do sorteio.</p>{periods.map(([k,l])=>{const own=myTasks.find(t=>t.period_key===k&&t.task_assignments?.some(a=>a.profile_id===p.id&&a.assignment_mode==='leader_choice'));const options=tasks.filter(t=>t.period_key===k);if(!options.length)return null;return <div key={k} style={{marginTop:12}}><b>{l}</b>{own?<p className="small">✓ {own.name}</p>:av.includes(k)?<div className="list">{options.map(t=><button className="btn" disabled={busy} key={t.id} onClick={()=>choose(t.id)}>{t.name}</button>)}</div>:<p className="muted small">Marque sua disponibilidade neste período para escolher.</p>}</div>})}</div>}</div><div className="card"><span className="eyebrow">O QUE FICOU DESSA GIRA?</span><p className="muted">As reflexões vinculadas a esta gira aparecem na Comunidade.</p></div></>:<><div className="hero"><span className="eyebrow">CALENDÁRIO DA CASA</span><h1>Giras</h1><p className="muted">Próximas e anteriores.</p></div><div className="list">{giras.map(g=><button className="card gira" key={g.id} onClick={()=>open(g)}><div className="art">🌱</div><div style={{textAlign:'left'}}><span className="pill">{new Date(g.starts_at)>=new Date()?'PRÓXIMA':'ENCERRADA'}</span><h2>{g.name}</h2><p>{dateTime(g.starts_at)}</p></div><ChevronRight style={{marginLeft:'auto'}}/></button>)}{!giras.length&&<div className="card empty">Nenhuma gira cadastrada.</div>}</div></>}</>
}
'''
          s=s[:start]+new+s[end:]
          start=s.index('function Community(')
          end=s.index('function ', start+10)
          new=r'''function Community({p}){
 const[posts,setPosts]=useState([]),[giras,setGiras]=useState([]),[open,setOpen]=useState(false),[editing,setEditing]=useState(null),[body,setBody]=useState(''),[kind,setKind]=useState('reflexao'),[giraId,setGiraId]=useState(''),[busy,setBusy]=useState(false),[msg,setMsg]=useState('')
 const load=async()=>{const {data}=await supabase.from('community_posts').select('id,author_id,body,kind,created_at,updated_at,gira_id,profiles!community_posts_author_id_fkey(name,orixa_symbol),giras(name)').order('created_at',{ascending:false});setPosts(data||[])}
 useEffect(()=>{load();supabase.from('giras').select('id,name').order('starts_at',{ascending:false}).limit(30).then(({data})=>setGiras(data||[]))},[])
 const startEdit=x=>{setEditing(x);setBody(x.body);setKind(x.kind);setGiraId(x.gira_id||'');setOpen(true);setMsg('')}
 const reset=()=>{setOpen(false);setEditing(null);setBody('');setKind('reflexao');setGiraId('');setMsg('')}
 const save=async()=>{if(!body.trim())return;setBusy(true);const payload={body:body.trim(),kind,gira_id:giraId||null};const r=editing?await supabase.from('community_posts').update(payload).eq('id',editing.id):await supabase.from('community_posts').insert({author_id:p.id,...payload});if(r.error)setMsg(r.error.message);else{reset();load()}setBusy(false)}
 const del=async id=>{if(!confirm('Excluir esta publicação?'))return;await supabase.from('community_posts').delete().eq('id',id);load()}
 return <><div className="hero"><span className="eyebrow">NOSSA COMUNIDADE</span><h1>Mural</h1><p className="muted">Ensinamentos, reflexões e o que ficou de cada gira.</p></div><button className="btn primary" onClick={()=>{setEditing(null);setBody('');setKind('reflexao');setGiraId('');setOpen(true)}}><Plus size={16}/> Compartilhar algo</button>{open&&<div className="card" style={{marginTop:12}}><div className="row between"><h3>{editing?'Editar publicação':'Nova publicação'}</h3><button className="btn" onClick={reset}>Fechar</button></div>{msg&&<div className="toast">{msg}</div>}<div className="field"><label>Tipo</label><select className="select" value={kind} onChange={e=>setKind(e.target.value)}><option value="ensinamento">Ensinamento</option><option value="reflexao">Reflexão</option><option value="senti">O que senti</option></select></div><div className="field"><label>Gira relacionada (opcional)</label><select className="select" value={giraId} onChange={e=>setGiraId(e.target.value)}><option value="">Nenhuma</option>{giras.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select></div><div className="field"><label>Mensagem</label><textarea className="input" rows="5" value={body} onChange={e=>setBody(e.target.value)} placeholder="Compartilhe com a comunidade…"/></div><button className="btn primary" disabled={busy} onClick={save}>{busy?'Salvando…':editing?'Salvar alterações':'Publicar'}</button></div>}<div className="list" style={{marginTop:12}}>{posts.map(x=><div className="card" key={x.id}><div className="row between"><b>{x.profiles?.orixa_symbol||'🌿'} {x.profiles?.name}</b><span className="eyebrow">{({ensinamento:'Ensinamento',reflexao:'Reflexão',senti:'O que senti'}[x.kind]||x.kind)}</span></div>{x.giras?.name&&<div className="pill" style={{display:'inline-block',marginTop:8}}>GIRA · {x.giras.name}</div>}<p>{x.body}</p><small className="muted">{dateTime(x.created_at)}</small>{x.author_id===p.id&&<div className="choice" style={{marginTop:10}}><button className="btn" onClick={()=>startEdit(x)}>Editar</button><button className="btn" onClick={()=>del(x.id)}><Trash2 size={14}/> Excluir</button></div>}</div>)}{!posts.length&&<div className="card empty">Ainda não há publicações. Seja a primeira pessoa a compartilhar.</div>}</div></>
}
'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Build
        run: npm install && npm run build
      - name: Commit and remove updater
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.jsx
          git diff --cached --quiet || git commit -m "Complete gira participation and community editing"
          git push
          rm -f .github/workflows/patch-giras-community.yml
          git add .github/workflows/patch-giras-community.yml
          git commit -m "Remove temporary UI patch workflow" || true
          git push || true
