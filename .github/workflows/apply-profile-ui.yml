name: Apply admin UI patch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin people
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main.jsx'); s=p.read_text()
          new=r'''function AdminPeople(){
 const[rows,setRows]=useState([]),[groups,setGroups]=useState([]),[edit,setEdit]=useState(null),[msg,setMsg]=useState('');
 const load=async()=>{const[{data:ps,error:e1},{data:gs,error:e2}]=await Promise.all([supabase.from('profiles').select('id,name,email,role,group_id,is_iniciado,is_active,leadership_seal,groups(name)').order('name'),supabase.from('groups').select('id,name,is_operational_default').order('name')]);if(e1||e2)setMsg((e1||e2).message);setRows(ps||[]);setGroups(gs||[])};
 useEffect(()=>{load()},[]);
 const save=async()=>{if(!edit)return;const{error}=await supabase.rpc('admin_set_profile',{p_profile_id:edit.id,p_role:edit.role,p_group_id:edit.group_id,p_leadership_seal:edit.leadership_seal,p_is_iniciado:edit.is_iniciado,p_is_active:edit.is_active});if(error)setMsg(error.message);else{setMsg('Cadastro atualizado.');setEdit(null);load()}};
 return <div className="card"><div className="row between"><div><h3>Pessoas</h3><p className="muted small">Cadastros, grupos, liderança e status.</p></div><button className="btn" onClick={load}><RefreshCw size={15}/></button></div>{msg&&<div className="toast">{msg}</div>}<div className="list">{rows.map(r=><div className="list-item" key={r.id}><div className="row between"><b>{r.name}</b><span className="pill">{r.role}</span></div><small className="muted">{r.email} · {r.groups?.name||'Sem grupo'}{r.leadership_seal?' · Liderança: '+r.leadership_seal:''}{r.is_iniciado?' · Iniciado':''}</small><div className="row" style={{marginTop:8}}><span className="pill">{r.is_active?'Ativo':'Inativo'}</span><button className="btn" onClick={()=>setEdit({...r,group_id:r.group_id||groups.find(g=>g.name==='Organização')?.id||'',leadership_seal:r.leadership_seal||'',is_iniciado:!!r.is_iniciado,is_active:!!r.is_active})}>Editar</button></div></div>)}</div>{edit&&<Modal title={'Editar · '+edit.name} close={()=>setEdit(null)}><Field label="Perfil"><select className="select" value={edit.role} onChange={e=>setEdit({...edit,role:e.target.value})}><option value="member">Membro</option><option value="editor">Editor</option><option value="admin">Administrador</option></select></Field><Field label="Grupo de atuação"><select className="select" value={edit.group_id||''} onChange={e=>setEdit({...edit,group_id:e.target.value})}>{groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select></Field><Field label="Selo de liderança"><input className="input" value={edit.leadership_seal} onChange={e=>setEdit({...edit,leadership_seal:e.target.value})} placeholder="Ex.: Cozinha, Comunicação…"/></Field><div className="row"><button className="btn" onClick={()=>setEdit({...edit,is_iniciado:!edit.is_iniciado})}>{edit.is_iniciado?'Iniciado ✓':'Marcar como Iniciado'}</button><button className="btn" onClick={()=>setEdit({...edit,is_active:!edit.is_active})}>{edit.is_active?'Ativo':'Inativo'}</button></div><button className="btn primary" style={{marginTop:12}} onClick={save}>Salvar alterações</button></Modal>}</div>}
'''
          pat=r'function AdminPeople\(\)\{.*?(?=function AdminGiras\()'
          s,n=re.subn(pat,new,s,flags=re.S)
          if n!=1: raise SystemExit(f'AdminPeople replacement failed: {n}')
          p.write_text(s)
          PY
      - name: Build
        run: npm install && npm run build
      - name: Commit and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git diff --cached --quiet || (git commit -m 'Complete admin people management' && git push)
          git rm -f .github/workflows/apply-profile-ui.yml
          git commit -m 'Remove temporary admin UI patch workflow'
          git push
