name: Apply checklist step 2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Trigger checklist step 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python scripts/apply-step2.py
      - name: Commit and remove updater
        run: |
          rm scripts/apply-step2.py .github/workflows/apply-step2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m 'Complete checklist step 2 editor management'
          git push
