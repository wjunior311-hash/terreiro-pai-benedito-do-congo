name: Fix Orixa symbols
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply official Orixa symbol UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch symbols
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          s=s.replace("import {supabase} from './lib/supabase'", "import {supabase} from './lib/supabase'\nimport {OrixaIcon,ORIXAS,normalizeOrixa} from './orixaSymbols'")
          old="const orixas=[['⚪','Oxalá'],['⚔️','Ogum'],['💛','Oxum'],['🌊','Iemanjá'],['⚡','Xangô'],['🌪️','Iansã'],['🏹','Oxóssi'],['🪻','Nanã'],['🌾','Obaluaiê'],['🦋','Logunedé'],['🔥','Exu'],['🌿','Ossain'],['🌙','Ewá'],['🪨','Obá']]"
          s=s.replace(old,"const orixas=ORIXAS")
          s=s.replace("{profile.orixa_symbol||'🌿'}", "<OrixaIcon name={profile.orixa_symbol} size={28}/>")
          s=s.replace("{p.orixa_symbol}", "<OrixaIcon name={p.orixa_symbol} size={24}/>")
          s=s.replace("{icon} {label}", "{label}")
          s=s.replace("value={icon}", "value={icon}")
          # Replace the select mapping so the option value is the symbol key, never an emoji.
          s=s.replace("{orixas.map(([icon,label])=><option key={label} value={icon}>{label}</option>)}", "{orixas.map(([icon,label])=><option key={label} value={icon}>{label}</option>)}")
          p.write_text(s)
          PY
          rm -f public/orixas/oxala.svg
          rm -f .github/workflows/fix-orixa-symbols.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/orixaSymbols.jsx .github/workflows/fix-orixa-symbols.yml public/orixas/oxala.svg
          git commit -m 'Apply official Orixa symbol UI'
          git push
