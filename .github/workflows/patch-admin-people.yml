name: Complete admin people management

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Complete admin people management'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AdminPeople
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          start=s.find('function AdminPeople(')
          end=s.find('function AdminGiras(', start)
          if start < 0 or end < 0: raise SystemExit('AdminPeople/AdminGiras boundary not found')
          fn=r'''function AdminPeople({p}){
 const [people,setPeople]=useState([]),[groups,setGroups]=useState([]),[editing,setEditing]=useState(null),[busy,setBusy]=useState(false),[msg,setMsg]=useState(''),[q,setQ]=useState('')
 const load=async()=>{const [{data:ps,error:pe},{data:gs,error:ge}]=await Promise.all([supabase.from('profiles').select('*,groups(id,name)').order('name'),supabase.from('groups').select('id,name').order('name')]);if(pe||ge){setMsg((pe||ge)?.message||'Não foi possível carregar as pessoas.');return}setPeople(ps||[]);setGroups(gs||[])}
 useEffect(()=>{load()},[])
 const save=async()=>{if(!editing)return;setBusy(true);setMsg('');const {error}=await supabase.from('profiles').update({name:editing.name,role:editing.role,is_active:editing.is_active,is_iniciado:editing.is_iniciado,leadership_seal:editing.leadership_seal||null,group_id:editing.group_id||null}).eq('id',editing.id);if(error)setMsg(error.message);else{setEditing(null);await load();setMsg('Pessoa atualizada.')}setBusy(false)}
 const filtered=people.filter(x=>(`${x.name||''} ${x.role||''} ${x.groups?.name||''}`.toLowerCase()).includes(q.toLowerCase()))
 return <><div className="row between"><div><span className="eyebrow">PESSOAS</span><h2 style={{margin:'6px 0'}}>Quem faz a casa</h2></div><button className="btn" onClick={load}><RefreshCw size={15}/> Atualizar</button></div>{msg&&<div className="toast">{msg}</div>}<div className="field"><label>Buscar pessoa</label><input className="input" value={q} onChange={e=>setQ(e.target.value)} placeholder="Nome, grupo ou papel"/></div><div className="list">{filtered.map(x=><div className="list-item" key={x.id}><div className="row between"><div><div className="row"><OrixaIcon name={x.orixa_symbol} size={30}/><div><b>{x.name}</b><div className="muted small">{x.groups?.name||'Sem grupo'} · {x.role==='admin'?'Administrador':x.role==='editor'?'Editor':'Membro'}</div></div></div><div className="row" style={{marginTop:8}}>{x.is_iniciado&&<span className="pill">INICIADO</span>}{x.leadership_seal&&<span className="pill">LIDERANÇA · {x.leadership_seal}</span>}{!x.is_active&&<span className="pill" style={{background:'#f4dddd',color:'#8a3939'}}>INATIVO</span>}</div></div><button className="btn" onClick={()=>setEditing({...x,group_id:x.group_id||x.groups?.id||''})}>Editar</button></div></div>)}{filtered.length===0&&<div className="empty">Nenhuma pessoa encontrada.</div>}</div>{editing&&<div className="modal-back"><div className="modal"><div className="row between"><div><span className="eyebrow">EDITAR PESSOA</span><h2 style={{margin:'6px 0'}}>{editing.name}</h2></div><button className="btn" onClick={()=>setEditing(null)}><X size={17}/></button></div><div className="field"><label>Nome</label><input className="input" value={editing.name||''} onChange={e=>setEditing({...editing,name:e.target.value})}/></div><div className="field"><label>Papel</label><select className="select" value={editing.role} onChange={e=>setEditing({...editing,role:e.target.value})}><option value="member">Membro</option><option value="editor">Editor</option><option value="admin">Administrador</option></select></div><div className="field"><label>Grupo de atuação</label><select className="select" value={editing.group_id||''} onChange={e=>setEditing({...editing,group_id:e.target.value})}><option value="">Sem grupo / Organização</option>{groups.filter(g=>g.name!=='Organização').map(g=><option key={g.id} value={g.id}>{g.name}</option>)}{groups.find(g=>g.name==='Organização')&&<option value={groups.find(g=>g.name==='Organização').id}>Organização</option>}</select></div><div className="field"><label>Selo de liderança</label><select className="select" value={editing.leadership_seal||''} onChange={e=>setEditing({...editing,leadership_seal:e.target.value})}><option value="">Sem selo</option><option>Comunicação</option><option>Organização Geral</option><option>Decoração</option><option>Cozinha</option><option>Manutenção</option></select></div><label className="row" style={{margin:'12px 0'}}><input type="checkbox" checked={!!editing.is_iniciado} onChange={e=>setEditing({...editing,is_iniciado:e.target.checked})}/> Iniciado</label><label className="row" style={{margin:'12px 0'}}><input type="checkbox" checked={!!editing.is_active} onChange={e=>setEditing({...editing,is_active:e.target.checked})}/> Acesso ativo</label><div className="row" style={{justifyContent:'flex-end',marginTop:16}}><button className="btn" onClick={()=>setEditing(null)}>Cancelar</button><button className="btn primary" disabled={busy} onClick={save}>{busy?'Salvando…':'Salvar alterações'}</button></div></div></div>}</>}
'''
          p.write_text(s[:start]+fn+'\n'+s[end:])
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.jsx
          git commit -m "Complete admin people management"
          git rm .github/workflows/patch-admin-people.yml
          git commit -m "Remove temporary admin people patch workflow"
          git push
